<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7a30d"><title>R4 directo</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f4f3f0}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:12px 15px 42px}header{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.badge{background:#f7a30d;color:white;font-size:25px;font-weight:850;padding:7px 11px;border-radius:9px}.topclock{margin-left:auto;font-weight:850;font-size:27px;font-variant-numeric:tabular-nums}.gear{border:0;background:white;border-radius:50%;width:42px;height:42px;font-size:20px}.stationbox{background:white;border-radius:15px;padding:10px 12px;margin-bottom:10px}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr) auto;align-items:center;gap:6px}.controls button,.controls select{min-width:0;border:1px solid #bbb;background:white;border-radius:9px;padding:9px 8px;font:inherit;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls .active{background:#222;color:white}.station-btn{width:100%}.refresh-btn{padding-inline:10px!important}.status{font-size:13px;color:#666;margin:8px 2px}.geo{font-size:11px;margin:5px 2px 0;color:#777}.train{margin:10px 0;border-radius:14px;overflow:hidden;background:white}.train.go{background:#dff3e4}.train.tight{background:#ffe6bf}.train.late{background:#f8d7da}.row{width:100%;display:grid;grid-template-columns:82px 1fr 82px 20px;align-items:start;gap:8px;padding:14px 12px;border:0;background:transparent;text-align:left;font:inherit;cursor:pointer}.label{font-size:11px;letter-spacing:.04em;color:#666;text-transform:uppercase}.time{font-size:28px;font-weight:850;line-height:1.15;font-variant-numeric:tabular-nums}.timeblock.right{text-align:right}.center{text-align:center}.count{font-size:27px;line-height:1.15;font-weight:850;white-space:nowrap}.center small{display:block;font-size:12px;color:#555;margin-top:4px;line-height:1.25}.delay{font-size:12px;color:#9a4500;font-weight:700;margin-top:3px}.arrow{color:#666;padding-top:8px}.details{display:none;border-top:1px solid #0002;padding:12px 17px}.details.open{display:block}.where{font-size:13px;background:#ffffffaa;border-radius:8px;padding:8px;margin-bottom:10px}.timeline{border-left:2px solid #aaa;margin-left:7px}.stop{position:relative;display:flex;justify-content:space-between;padding:0 0 12px 15px;font-size:14px}.stop:before{content:'';position:absolute;left:-6px;top:4px;width:8px;height:8px;border-radius:50%;background:#888}.stop.current{font-weight:750}.stop.current:before{width:12px;height:12px;left:-8px;background:#f7a30d}.empty,.error{padding:20px;background:white;border-radius:12px;color:#555}.modal{display:none;position:fixed;inset:0;background:#0007;padding:18px;overflow:auto}.modal.open{display:block}.dialog{background:white;border-radius:16px;max-width:500px;margin:20px auto;padding:20px}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.field select,.field input{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end}.actions button{padding:10px 14px;border-radius:9px;border:1px solid #aaa;background:white;font:inherit}.actions .save{background:#222;color:white}.note{font-size:12px;color:#666;line-height:1.4}@media(max-width:450px){main{padding:10px 12px 32px}header{margin:2px 0 9px}.topclock{font-size:25px}.stationbox{padding:9px 10px;margin-bottom:8px}.controls{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:5px}.controls button{padding:8px 6px;font-size:12px}.refresh-btn{font-size:0!important;padding:8px 11px!important}.refresh-btn:after{content:'↻';font-size:19px}.geo{margin-top:4px}.status{margin:7px 2px}.row{grid-template-columns:68px 1fr 68px 14px;gap:5px;padding:13px 8px}.time,.count{font-size:23px}}
</style></head><body><main><header><div class="badge">R4</div><div class="topclock" id="clock">--:--:--</div><button class="gear" id="gear" aria-label="Configuración">⚙</button></header><section class="stationbox"><div class="controls"><button class="station-btn" id="homeBtn">Cerdanyola</button><button class="station-btn" id="workBtn">Barcelona-Sants</button><button class="refresh-btn" id="refresh" aria-label="Actualizar" title="Actualizar">↻ Actualizar</button></div><div id="geo" class="geo">Localizando…</div></section><div id="status" class="status">Consultando Renfe…</div><div id="list"></div><p class="note">Programación oficial GTFS de Renfe para hoy, combinada con retrasos y posiciones en tiempo real. Fuente: Renfe Operadora (CC BY 4.0).</p></main><div class="modal" id="modal"><div class="dialog"><h2>Configuración</h2><div class="field"><label>Estación de casa</label><select id="home"></select></div><div class="field"><label>Estación de trabajo</label><select id="work"></select></div><div class="actions"><button id="close">Cancelar</button><button id="save" class="save">Guardar</button></div></div></div><script>
const $=id=>document.getElementById(id);let prefs=JSON.parse(localStorage.getItem('r4-prefs')||'{"home":"78706","work":"71801"}'),mode=localStorage.getItem('r4-mode')||'home',stations=[],opened=new Set(),last=null;
const fmt=t=>new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}).format(new Date(t*1000));
function updateButtons(){ $('homeBtn').textContent=stations.find(s=>s.id===prefs.home)?.name||'Cerdanyola';$('workBtn').textContent=stations.find(s=>s.id===prefs.work)?.name||'Barcelona-Sants';$('homeBtn').title=$('homeBtn').textContent;$('workBtn').title=$('workBtn').textContent;$('homeBtn').classList.toggle('active',mode==='home');$('workBtn').classList.toggle('active',mode==='work') }
function choose(m){mode=m;localStorage.setItem('r4-mode',mode);$('geo').textContent='Estación elegida manualmente';updateButtons();load()}
function render(d){last=d;if(!d.items.length){$('list').innerHTML='<div class="empty">No hay trenes en los próximos 60 minutos.</div>';return}
$('list').innerHTML=d.items.map((x,i)=>{const left=(x.predicted-Date.now()/1000)/60,mins=Math.max(0,Math.ceil(left)),color=mode==='home'?(left>15?'go':left>=10?'tight':'late'):(left>30?'go':left>=20?'tight':'late'),id='det'+i,place=x.position?.stopName||'Posición no disponible',movement=x.position?(x.position.status==='STOPPED_AT'?'Detenido en':x.position.status==='INCOMING_AT'?'Llegando a':'En ruta hacia'):'Sin posición publicada',delay=Math.round(x.delaySeconds/60),start=x.timeline.map(s=>'<div class="stop '+(s.current?'current':'')+'"><span>'+s.name+'</span><span>'+fmt(s.predicted)+'</span></div>').join('');return '<article class="train '+color+'"><button class="row" data-id="'+id+'" data-trip="'+x.tripId+'"><div><span class="label">Salida</span><div class="time">'+fmt(x.predicted)+'</div>'+(delay?'<div class="delay">'+(delay>0?'+':'')+delay+' min</div>':'')+'</div><div class="center"><div class="count">'+(x.cancelled?'Cancelado':left<=0?'Saliendo':mins+' min')+'</div><small>'+place+'<br>'+movement+'</small></div><div class="timeblock right"><span class="label">Llegada</span><div class="time">'+fmt(x.predictedArrival)+'</div></div><span class="arrow">⌄</span></button><div class="details '+(opened.has(x.tripId)?'open':'')+'" id="'+id+'"><div class="where">'+movement+' '+place+(x.position?.platform?' · vía '+x.position.platform:'')+'</div><div class="timeline">'+start+'</div></div></article>'}).join('');document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{const d=$ (b.dataset.id);d.classList.toggle('open');d.classList.contains('open')?opened.add(b.dataset.trip):opened.delete(b.dataset.trip)})}
async function load(){updateButtons();$('status').textContent='Actualizando horario de hoy y datos en directo…';try{const u='/api/departures?origin='+encodeURIComponent(mode==='home'?prefs.home:prefs.work)+'&destination='+encodeURIComponent(mode==='home'?prefs.work:prefs.home),r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Error al consultar Renfe');$('status').textContent='Horario del '+d.serviceDate+' · actualizado '+new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(d.generatedAt*1000))+' · '+(d.scheduleCache==='hit'?'copia diaria':'descargado ahora');render(d)}catch(e){$('status').className='status error';$('status').textContent='No se pudo comprobar el horario de hoy: '+e.message;$('list').innerHTML='<div class="error">No mostramos horarios antiguos como si fueran actuales. Pulsa Actualizar para volver a intentarlo.</div>'}}
function fillStations(){const opts=stations.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');$('home').innerHTML=opts;$('work').innerHTML=opts;$('home').value=prefs.home;$('work').value=prefs.work}
function settings(){fillStations();$('modal').classList.add('open')}function save(){if($('home').value===$('work').value)return alert('Selecciona estaciones diferentes para casa y trabajo.');prefs={home:$('home').value,work:$('work').value};localStorage.setItem('r4-prefs',JSON.stringify(prefs));$('modal').classList.remove('open');updateButtons();load()}
function detect(){if(!navigator.geolocation){$('geo').textContent='Ubicación no disponible · usando última estación';return}let secs=5,done=false;$('geo').textContent='Localizando… '+secs+' s';const timer=setInterval(()=>{secs--;if(secs>0&&!done)$('geo').textContent='Localizando… '+secs+' s'},1000),end=msg=>{if(done)return;done=true;clearInterval(timer);$('geo').textContent=msg};const fallback=setTimeout(()=>end('No se pudo localizar · usando última estación'),5100);navigator.geolocation.getCurrentPosition(p=>{clearTimeout(fallback);if(done)return;const h=stations.find(s=>s.id===prefs.home),w=stations.find(s=>s.id===prefs.work);if(!h||!w)return end('Ubicación detectada');const dist=s=>Math.hypot(p.coords.latitude-s.lat,p.coords.longitude-s.lon);mode=dist(h)<dist(w)?'home':'work';localStorage.setItem('r4-mode',mode);end('Ubicación detectada');updateButtons();load()},()=>{clearTimeout(fallback);end('No se pudo localizar · usando última estación')},{timeout:5000,maximumAge:300000})}
async function init(){try{const r=await fetch('/api/stations',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);stations=d.stations;updateButtons();await load();detect()}catch(e){$('status').className='status error';$('status').textContent='No se pudo cargar el horario vigente: '+e.message;$('list').innerHTML='<div class="error">La consulta a Renfe o el almacenamiento no está disponible. Reintenta más tarde.</div>';stations=[{id:'78706',name:'Cerdanyola del Vallès'},{id:'71801',name:'Barcelona-Sants'}];updateButtons()}}
$('homeBtn').onclick=()=>choose('home');$('workBtn').onclick=()=>choose('work');$('refresh').onclick=load;$('gear').onclick=settings;$('close').onclick=()=>$('modal').classList.remove('open');$('save').onclick=save;
function clock(){$('clock').textContent=new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}clock();setInterval(clock,1000);init();setInterval(load,30000);
</script></body></html>
